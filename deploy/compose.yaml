services:
  shopping-assistant-fe:
    image: ghcr.io/dimitarrachev/shopping-assistant-fe:${APP_VERSION}
    container_name: shopping-assistant-fe
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro