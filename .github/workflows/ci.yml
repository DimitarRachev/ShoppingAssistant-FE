name: Frontend CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 25
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read application version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Application version: $VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/shopping-assistant-fe
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_BASE_URL=/api/v1
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload deployment configuration
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.ORACLE_HOST }}
          username: ${{ vars.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          source: "deploy/compose.yaml"
          target: "/opt/shopping-assistant-fe"

  deploy:
    name: Deploy to FE VM
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.ORACLE_HOST }}
          username: ${{ vars.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /opt/shopping-assistant-fe

            VERSION="${{ needs.docker.outputs.version }}"

            echo "Deploying version: $VERSION"

            echo "Updating application version..."
            sed -i "s/^APP_VERSION=.*/APP_VERSION=$VERSION/" .env

            echo "Current .env:"
            cat .env

            echo "Pulling Docker image..."
            docker compose \
              --env-file .env \
              -f deploy/compose.yaml \
              pull

            echo "Starting application..."
            docker compose \
              --env-file .env \
              -f deploy/compose.yaml \
              up -d

            echo "Running image:"
            docker inspect shopping-assistant-fe \
              --format '{{.Config.Image}}'

            echo "Waiting for application readiness..."

            for i in {1..30}; do
              if curl -kfsS --connect-timeout 2 \
                https://localhost/api/v1/version > /tmp/version.json; then
                break
              fi
              sleep 2
            done

            echo "Application version response:"
            cat /tmp/version.json

            test -s /tmp/version.json
            grep -q "\"version\":\"$VERSION\"" /tmp/version.json

            echo "Deployment verified successfully"
            echo "Version: $VERSION"